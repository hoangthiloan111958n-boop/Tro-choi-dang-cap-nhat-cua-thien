<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Kinh Dị Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #1e293b;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            position: relative;
        }

        /* Top Bar Controls */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 10px;
        }

        .btn-mode {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-mode:hover {
            background: #2563eb;
        }

        .music-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Question / Game Screen */
        .game-screen {
            display: block;
        }

        .health-bar-container {
            width: 100%;
            background: #334155;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #22c55e);
            transition: width 0.3s ease;
        }

        .q-number {
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .q-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-option {
            background: #334155;
            color: white;
            border: 2px solid #475569;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .btn-option:hover {
            background: #475569;
            border-color: #3b82f6;
            transform: translateY(-2px);
        }

        .btn-option span {
            display: inline-block;
            width: 30px;
            height: 30px;
            background: #0f172a;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            margin-right: 12px;
            font-weight: bold;
            color: #3b82f6;
        }

        /* Result Area */
        .result-box {
            display: none;
            margin-top: 20px;
            text-align: center;
            padding: 15px;
            background: #0f172a;
            border-radius: 10px;
        }

        .result-img {
            max-width: 100%;
            max-height: 350px;
            border-radius: 8px;
            margin-top: 15px;
            object-fit: cover;
            border: 2px solid #334155;
        }

        .btn-next {
            margin-top: 15px;
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Studio / Admin Editor Mode */
        .studio-screen {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .q-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #3b82f6;
            position: relative;
        }

        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Jumpscare Horror FX */
        .jumpscare-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .jumpscare-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .flash-red {
            animation: flash 0.1s infinite;
        }

        .shake-screen {
            animation: shake 0.1s infinite;
        }

        @keyframes flash {
            0% { background-color: red; }
            50% { background-color: black; }
            100% { background-color: red; }
        }

        @keyframes shake {
            0% { transform: translate(5px, 5px) rotate(0deg); }
            20% { transform: translate(-5px, -5px) rotate(-1deg); }
            40% { transform: translate(-5px, 5px) rotate(1deg); }
            60% { transform: translate(5px, -5px) rotate(0deg); }
            80% { transform: translate(5px, 5px) rotate(1deg); }
            100% { transform: translate(-5px, -5px) rotate(-1deg); }
        }
    </style>
</head>
<body id="main-body">

    <!-- Nhạc nền GitHub mới đã được thay thế tại đây -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://github.com/hoangthiloan111958n-boop/Tro-choi-dang-cap-nhat-cua-thien/raw/main/Sleeping%20city%20%5B80EAuJ00So0%5D.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- thanh điều hướng top -->
        <div class="top-bar">
            <button class="btn-mode" id="btn-toggle-mode" onclick="toggleMode()">🛠️ Studio Sửa Câu Hỏi</button>
            <button class="music-btn" id="btn-music" onclick="toggleMusic()">🎵 Bật/Tắt Nhạc Nền</button>
        </div>

        <!-- MÀN HÌNH CHƠI GAME -->
        <div class="game-screen" id="game-screen">
            <div class="health-bar-container">
                <div class="health-bar" id="progress-bar"></div>
            </div>

            <div id="quiz-box">
                <div class="q-number" id="q-number">Câu hỏi 1</div>
                <div class="q-text" id="q-text">Đang tải câu hỏi...</div>

                <div class="options-grid">
                    <button class="btn-option" onclick="checkAnswer('A')"><span>A</span> <div id="opt-a-text">Đáp án A</div></button>
                    <button class="btn-option" onclick="checkAnswer('B')"><span>B</span> <div id="opt-b-text">Đáp án B</div></button>
                </div>
            </div>

            <!-- Kết quả hiển thị sau khi chọn -->
            <div class="result-box" id="result-box">
                <h3 id="result-title"></h3>
                <img id="result-img" class="result-img" src="" alt="Kết quả">
                <div>
                    <button class="btn-next" id="btn-next" onclick="nextQuestion()">Tiếp theo ➔</button>
                </div>
            </div>
        </div>

        <!-- MÀN HÌNH STUDIO (TẠO/SỬA CÂU HỎI) -->
        <div class="studio-screen" id="studio-screen">
            <h2 style="margin-bottom: 20px; text-align: center;">🎨 Trình Quản Lý Câu Hỏi</h2>
            
            <div id="questions-list">
                <!-- Danh sách câu hỏi hiển thị ở đây -->
            </div>

            <button class="btn-mode" style="background: #10b981; width: 100%; padding: 12px; margin-top: 10px;" onclick="addNewQuestion()">+ Thêm Câu Hỏi Mới</button>
        </div>
    </div>

    <!-- Màn hình Jumpscare Ma Dọa -->
    <div class="jumpscare-overlay" id="jumpscare-overlay" onclick="closeJumpscare()">
        <img id="jumpscare-img" src="" alt="MA DOA">
    </div>

    <script>
        // Danh sách câu hỏi mặc định
        const defaultQuestions = [
            {
                id: 1,
                text: "Câu 1: Chọn đáp án A là ĐÚNG, chọn B sẽ bị MA DỌA!",
                optionA: "Đáp án A (An toàn)",
                optionB: "Đáp án B (Nguy hiểm)",
                correct: "A",
                correctImg: "https://picsum.photos/500/350?random=1",
                scareImg: "https://i.imgur.com/2x81xGg.jpeg",
                scareSoundUrl: ""
            },
            {
                id: 2,
                text: "Câu 2: Chọn đáp án B mới là ĐÚNG!",
                optionA: "Đáp án A (Sai nè)",
                optionB: "Đáp án B (Chính xác)",
                correct: "B",
                correctImg: "https://picsum.photos/500/350?random=2",
                scareImg: "https://i.imgur.com/2x81xGg.jpeg",
                scareSoundUrl: ""
            }
        ];

        let questions = JSON.parse(localStorage.getItem('my_quiz_questions')) || defaultQuestions;
        let currentIdx = 0;
        let isStudioMode = false;
        let isMusicPlaying = false;

        const bgMusic = document.getElementById('bg-music');

        // Bật / Tắt Nhạc nền
        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                isMusicPlaying = false;
                document.getElementById('btn-music').innerText = "🎵 Bật Nhạc Nền";
            } else {
                bgMusic.volume = 0.4;
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    document.getElementById('btn-music').innerText = "⏸️ Tắt Nhạc Nền";
                }).catch(err => {
                    alert("Hãy click vào trang web trước khi bật nhạc!");
                });
            }
        }

        // Tải câu hỏi lên màn hình chơi
        function loadQuestion() {
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('quiz-box').style.display = 'block';

            if (questions.length === 0) {
                document.getElementById('q-text').innerText = "Chưa có câu hỏi nào! Hãy vào Studio để tạo.";
                return;
            }

            const q = questions[currentIdx];
            document.getElementById('q-number').innerText = `CÂU HỎI ${currentIdx + 1} / ${questions.length}`;
            document.getElementById('q-text').innerText = q.text;
            document.getElementById('opt-a-text').innerText = q.optionA;
            document.getElementById('opt-b-text').innerText = q.optionB;

            // Cập nhật thanh tiến trình
            const progress = ((currentIdx + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
        }

        // Kiểm tra câu trả lời
        function checkAnswer(choice) {
            const q = questions[currentIdx];
            const isCorrect = (choice === q.correct);

            document.getElementById('quiz-box').style.display = 'none';
            const resultBox = document.getElementById('result-box');
            const resultTitle = document.getElementById('result-title');
            const resultImg = document.getElementById('result-img');

            if (isCorrect) {
                resultTitle.innerText = "🎉 CHÍNH XÁC! XUẤT SẮC LẮM!";
                resultTitle.style.color = "#22c55e";
                resultImg.src = q.correctImg || "https://picsum.photos/500/350";
                resultBox.style.display = 'block';
                playWinSound();
            } else {
                // Kích hoạt hiệu ứng Ma Dọa (Jumpscare)
                triggerJumpscare(q.scareImg, q.scareSoundUrl);
            }
        }

        // Hiệu ứng Jumpscare hù dọa
        function triggerJumpscare(imgUrl, customSoundUrl) {
            const overlay = document.getElementById('jumpscare-overlay');
            const img = document.getElementById('jumpscare-img');
            const body = document.getElementById('main-body');

            img.src = imgUrl || "https://i.imgur.com/2x81xGg.jpeg";
            overlay.style.display = 'flex';
            body.classList.add('flash-red', 'shake-screen');

            // Phát tiếng la hét kinh dị bằng Web Audio API nếu không có link riêng
            if (customSoundUrl) {
                const customAudio = new Audio(customSoundUrl);
                customAudio.play();
            } else {
                playScreamSound();
            }

            setTimeout(() => {
                closeJumpscare();
            }, 2500);
        }

        function closeJumpscare() {
            const overlay = document.getElementById('jumpscare-overlay');
            const body = document.getElementById('main-body');
            overlay.style.display = 'none';
            body.classList.remove('flash-red', 'shake-screen');

            // Hiển thị lại kết quả thua
            const resultBox = document.getElementById('result-box');
            const resultTitle = document.getElementById('result-title');
            const resultImg = document.getElementById('result-img');
            
            resultTitle.innerText = "💀 BẠN ĐÃ CHỌN SAI RỒI!";
            resultTitle.style.color = "#ef4444";
            resultImg.src = questions[currentIdx].scareImg || "https://i.imgur.com/2x81xGg.jpeg";
            resultBox.style.display = 'block';
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                alert("Chúc mừng bạn đã hoàn thành tất cả các câu hỏi!");
                currentIdx = 0;
                loadQuestion();
            }
        }

        // Chuyển đổi qua lại giữa Play Mode và Studio Mode
        function toggleMode() {
            isStudioMode = !isStudioMode;
            const gameScreen = document.getElementById('game-screen');
            const studioScreen = document.getElementById('studio-screen');
            const btnToggle = document.getElementById('btn-toggle-mode');

            if (isStudioMode) {
                gameScreen.style.display = 'none';
                studioScreen.style.display = 'block';
                btnToggle.innerText = "🎮 Quay Lại Chơi Game";
                renderStudio();
            } else {
                gameScreen.style.display = 'block';
                studioScreen.style.display = 'none';
                btnToggle.innerText = "🛠️ Studio Sửa Câu Hỏi";
                saveStudioData();
                currentIdx = 0;
                loadQuestion();
            }
        }

        // Hiển thị danh sách sửa câu hỏi trong Studio
        function renderStudio() {
            const container = document.getElementById('questions-list');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'q-card';
                card.innerHTML = `
                    <button class="btn-delete" onclick="deleteQuestion(${index})">Xóa</button>
                    <div class="form-group">
                        <label>Câu hỏi ${index + 1}:</label>
                        <input type="text" class="form-control" value="${q.text}" onchange="updateQ(${index}, 'text', this.value)">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Đáp án A:</label>
                            <input type="text" class="form-control" value="${q.optionA}" onchange="updateQ(${index}, 'optionA', this.value)">
                        </div>
                        <div class="form-group">
                            <label>Đáp án B:</label>
                            <input type="text" class="form-control" value="${q.optionB}" onchange="updateQ(${index}, 'optionB', this.value)">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Đáp án đúng:</label>
                        <select class="form-control" onchange="updateQ(${index}, 'correct', this.value)">
                            <option value="A" ${q.correct === 'A' ? 'selected' : ''}>Đáp án A</option>
                            <option value="B" ${q.correct === 'B' ? 'selected' : ''}>Đáp án B</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Link Ảnh khi Đúng:</label>
                        <input type="text" class="form-control" value="${q.correctImg}" onchange="updateQ(${index}, 'correctImg', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Link Ảnh Ma Dọa (Khi Sai):</label>
                        <input type="text" class="form-control" value="${q.scareImg}" onchange="updateQ(${index}, 'scareImg', this.value)">
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateQ(index, key, val) {
            questions[index][key] = val;
            saveStudioData();
        }

        function addNewQuestion() {
            questions.push({
                id: Date.now(),
                text: "Câu hỏi mới...",
                optionA: "Lựa chọn A",
                optionB: "Lựa chọn B",
                correct: "A",
                correctImg: "https://picsum.photos/500/350",
                scareImg: "https://i.imgur.com/2x81xGg.jpeg",
                scareSoundUrl: ""
            });
            saveStudioData();
            renderStudio();
        }

        function deleteQuestion(index) {
            if (confirm("Bạn có chắc muốn xóa câu hỏi này?")) {
                questions.splice(index, 1);
                saveStudioData();
                renderStudio();
            }
        }

        function saveStudioData() {
            localStorage.setItem('my_quiz_questions', JSON.stringify(questions));
        }

        // Âm thanh Web Audio API
        function playScreamSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 1.5);

                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 1.5);
            } catch(e){}
        }

        function playWinSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(800, ctx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch(e){}
        }

        // Khởi chạy ban đầu
        loadQuestion();
    </script>
</body>
</html>
